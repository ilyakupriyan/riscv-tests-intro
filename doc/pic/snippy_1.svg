<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#172C51"/>
    </marker>
    <pattern id="gap" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#D9D9D9" stroke-width="6"/>
    </pattern>
    <style>
      .t  { font-family: Consolas, "JetBrains Mono", monospace; font-size: 22px; fill: #000000; }
      .tb { font-family: Consolas, "JetBrains Mono", monospace; font-size: 22px; fill: #0D0CFC; }
      .ts { font-family: Consolas, "JetBrains Mono", monospace; font-size: 18px; fill: #404040; }
      .ta { font-family: Consolas, "JetBrains Mono", monospace; font-size: 20px; fill: #172C51; }
      .th { font-family: Consolas, "JetBrains Mono", monospace; font-size: 24px; fill: #172C51; font-weight: 700; }
      .box  { stroke: #172C51; stroke-width: 2.5; }
      .line { stroke: #172C51; stroke-width: 2.5; fill: none; }
      .tick { stroke: #172C51; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#FFFFFF"/>
  <text x="40" y="50" class="th">Карта памяти итогового образа program.elf (не в масштабе)</text>

  <!-- Address axis labels (top = lower address) -->
  <!-- Map column: x 300..760 -->

  <!-- .text.init -->
  <rect x="300" y="90" width="460" height="80" class="box" fill="#F4B183"/>
  <text x="530" y="125" text-anchor="middle" class="tb">.text.init</text>
  <text x="530" y="152" text-anchor="middle" class="ts">_start, write_tohost</text>
  <line x1="280" y1="90" x2="300" y2="90" class="tick"/>
  <text x="270" y="97" text-anchor="end" class="ta">0x80000000</text>

  <!-- gap -->
  <rect x="300" y="170" width="460" height="40" class="box" fill="url(#gap)"/>

  <!-- .snippy.text.rx -->
  <rect x="300" y="210" width="460" height="170" class="box" fill="#C5E0B4"/>
  <text x="530" y="280" text-anchor="middle" class="tb">.snippy.text.rx</text>
  <text x="530" y="308" text-anchor="middle" class="ts">SnippyFunction ... __snippy_exit</text>
  <line x1="280" y1="210" x2="300" y2="210" class="tick"/>
  <text x="270" y="217" text-anchor="end" class="ta">0x80001000</text>

  <!-- .snippy.stack.rw -->
  <rect x="300" y="380" width="460" height="110" class="box" fill="#DEEBF7"/>
  <text x="530" y="418" text-anchor="middle" class="tb">.snippy.stack.rw</text>
  <text x="530" y="446" text-anchor="middle" class="ts">NOLOAD, стек растет к меньшим адресам</text>
  <text x="530" y="474" text-anchor="middle" class="ts">__stack_top = 0x80087000</text>
  <line x1="280" y1="380" x2="300" y2="380" class="tick"/>
  <text x="270" y="387" text-anchor="end" class="ta">0x80081000</text>
  <line x1="280" y1="490" x2="300" y2="490" class="tick"/>
  <text x="270" y="497" text-anchor="end" class="ta">0x80087000</text>

  <!-- gap -->
  <rect x="300" y="490" width="460" height="40" class="box" fill="url(#gap)"/>

  <!-- .snippy.data.rw -->
  <rect x="300" y="530" width="460" height="110" class="box" fill="#FFD5D5"/>
  <text x="530" y="578" text-anchor="middle" class="tb">.snippy.data.rw</text>
  <text x="530" y="606" text-anchor="middle" class="ts">NOLOAD, область LW/SW</text>
  <line x1="280" y1="530" x2="300" y2="530" class="tick"/>
  <text x="270" y="537" text-anchor="end" class="ta">0x80091000</text>
  <line x1="280" y1="640" x2="300" y2="640" class="tick"/>
  <text x="270" y="647" text-anchor="end" class="ta">0x80097000</text>

  <!-- gap -->
  <rect x="300" y="640" width="460" height="40" class="box" fill="url(#gap)"/>

  <!-- .tohost -->
  <rect x="300" y="680" width="460" height="80" class="box" fill="#FFF2CC"/>
  <text x="530" y="715" text-anchor="middle" class="tb">.tohost</text>
  <text x="530" y="742" text-anchor="middle" class="ts">tohost, fromhost</text>
  <line x1="280" y1="680" x2="300" y2="680" class="tick"/>
  <text x="270" y="687" text-anchor="end" class="ta">0x80100000</text>

  <!-- Right side: who defines what -->
  <rect x="880" y="95" width="460" height="70" rx="12" class="box" fill="#DEEBF7"/>
  <text x="1110" y="127" text-anchor="middle" class="tb">crt_snippy.S</text>
  <text x="1110" y="152" text-anchor="middle" class="ts">+ snippy_miriscv.ld</text>
  <line x1="878" y1="130" x2="762" y2="130" class="line" marker-end="url(#arr)"/>

  <rect x="880" y="215" width="460" height="440" rx="12" class="box" fill="#DEEBF7"/>
  <text x="1110" y="410" text-anchor="middle" class="tb">snippy.yaml</text>
  <text x="1110" y="440" text-anchor="middle" class="ts">sections: text, stack, data</text>
  <text x="1110" y="466" text-anchor="middle" class="ts">-> snippy.elf.ld</text>
  <line x1="878" y1="295" x2="762" y2="295" class="line" marker-end="url(#arr)"/>
  <line x1="878" y1="435" x2="762" y2="435" class="line" marker-end="url(#arr)"/>
  <line x1="878" y1="585" x2="762" y2="585" class="line" marker-end="url(#arr)"/>

  <rect x="880" y="690" width="460" height="70" rx="12" class="box" fill="#DEEBF7"/>
  <text x="1110" y="722" text-anchor="middle" class="tb">crt_snippy.S</text>
  <text x="1110" y="747" text-anchor="middle" class="ts">+ snippy_miriscv.ld</text>
  <line x1="878" y1="720" x2="762" y2="720" class="line" marker-end="url(#arr)"/>

  <!-- program.bin span -->
  <line x1="200" y1="790" x2="860" y2="790" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="530" y="825" text-anchor="middle" class="ts">program.bin: 0x80000000 ... 0x80100044, промежутки и NOLOAD-секции</text>
  <text x="530" y="850" text-anchor="middle" class="ts">заполняются нулями при экспорте objcopy -O binary</text>
</svg>
